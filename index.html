<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - Bison Fitness Club</title>

  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@600;700;800;900&family=Rubik:wght@400;500;800&display=swap" rel="stylesheet">

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                  url("https://images.unsplash.com/photo-1558611848-73f7eb4001ab");
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .auth-container {
      background: #111;
      padding: 40px;
      width: 380px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
      border-top: 4px solid hsl(12, 98%, 52%);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-logo ion-icon {
      font-size: 40px;
      color: hsl(12, 98%, 52%);
    }

    .auth-logo h1 {
      font-family: 'Catamaran', sans-serif;
      font-size: 22px;
      color: hsl(12, 98%, 52%);
      margin-top: 10px;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .auth-form h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #fff;
      font-size: 24px;
    }

    .auth-form p {
      text-align: center;
      color: #888;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .inline-message {
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .inline-message.show {
      display: block;
    }

    .inline-message.success {
      background: rgba(0, 200, 83, 0.2);
      color: #00c853;
      border: 1px solid #00c853;
    }

    .inline-message.error {
      background: rgba(255, 23, 68, 0.2);
      color: #ff1744;
      border: 1px solid #ff1744;
    }

    .inline-message.warning {
      background: rgba(255, 145, 0, 0.2);
      color: #ff9100;
      border: 1px solid #ff9100;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 5px;
      outline: none;
      font-size: 14px;
      box-sizing: border-box;
      background: #222;
      color: #fff;
      border: 1px solid #333;
      transition: border-color 0.3s;
    }

    .input-group input::placeholder {
      color: #666;
    }

    .input-group input:focus {
      border-color: hsl(12, 98%, 52%);
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: hsl(12, 98%, 52%);
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .auth-btn:hover {
      background: #e65c00;
    }

    .auth-btn:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .auth-btn .spinning {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .demo-account {
      background: rgba(255, 102, 0, 0.1);
      border: 1px solid rgba(255, 102, 0, 0.3);
      border-radius: 5px;
      padding: 10px;
      margin-top: 15px;
      text-align: center;
    }

    .demo-account p {
      margin: 0;
      font-size: 12px;
      color: #ccc;
    }

    .demo-account p:first-child {
      color: hsl(12, 98%, 52%);
      font-weight: 600;
      margin-bottom: 5px;
    }

    .demo-account strong {
      color: #fff;
    }

    .auth-link {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }

    .auth-link a {
      color: hsl(12, 98%, 52%);
      text-decoration: none;
      cursor: pointer;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #888;
      text-decoration: none;
      font-size: 14px;
    }

    .back-home:hover {
      color: hsl(12, 98%, 52%);
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-logo">
    <ion-icon name="barbell-sharp"></ion-icon>
    <h1>Bison Fitness Club</h1>
  </div>

  <!-- Login Form -->
  <form class="auth-form active" id="login-form">
    <h2>Welcome Back</h2>
    <p>Login to continue your fitness journey</p>
    
    <div class="inline-message" id="login-message"></div>

    <div class="input-group">
      <input type="text" id="login-username" placeholder="Username" required>
    </div>

    <div class="input-group">
      <input type="password" id="login-password" placeholder="Password" required>
    </div>

    <button type="submit" class="auth-btn" id="login-btn">
      <span>Login</span>
      <ion-icon name="arrow-forward-outline"></ion-icon>
    </button>

    <!-- <div class="demo-account">
      <p>Demo Account</p>
      <p>Username: <strong>testuser</strong> | Password: <strong>test123</strong></p>
    </div> -->

    <p class="auth-link">
      Don't have an account? <a id="show-signup">Sign Up</a>
    </p>
  </form>

  <!-- Sign Up Form -->
  <form class="auth-form" id="signup-form">
    <h2>Create Account</h2>
    <p>Join Bison Fitness Club today</p>

    <div class="inline-message" id="signup-message"></div>

    <div class="input-group">
      <input type="text" id="signup-username" placeholder="Username" required>
    </div>

    <div class="input-group">
      <input type="email" id="signup-email" placeholder="Email" required>
    </div>

    <div class="input-group">
      <input type="password" id="signup-password" placeholder="Password" required>
    </div>

    <div class="input-group">
      <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
    </div>

    <button type="submit" class="auth-btn" id="signup-btn">
      <span>Sign Up</span>
      <ion-icon name="arrow-forward-outline"></ion-icon>
    </button>

    <p class="auth-link">
      Already have an account? <a id="show-login">Login</a>
    </p>
  </form>
</div>

<a href="home.html" class="back-home">
  <!-- <ion-icon name="arrow-back-outline"></ion-icon> Back to Home -->
</a>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDIEHr28v0Q8sG4U6pYz7oiPOMt2GbEqnw",
    authDomain: "bison-fitness-club.firebaseapp.com",
    projectId: "bison-fitness-club",
    storageBucket: "bison-fitness-club.firebasestorage.app",
    messagingSenderId: "365308864069",
    appId: "1:365308864069:web:9dc42337912b55107ca52c"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  window.db = db;
  window.firebase = firebase;

  function showInlineMessage(messageId, type, message) {
    const msgEl = document.getElementById(messageId);
    if (!msgEl) return;
    msgEl.className = 'inline-message ' + type + ' show';
    msgEl.textContent = message;
    setTimeout(function() {
      msgEl.classList.remove('show');
    }, 4000);
  }

  async function createDemoUser() {
    if (!window.db) return;
    try {
      var usersRef = window.db.collection("users");
      var snapshot = await usersRef.where("username", "==", "testuser").get();
      if (snapshot.empty) {
        await window.db.collection("users").add({
          username: "testuser",
          email: "test@bisonfitness.com",
          password: "test123",
          createdAt: new Date().toISOString()
        });
        console.log("Demo user created");
      }
    } catch (error) {
      console.log("Demo user check:", error.message);
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    var loginForm = document.getElementById('login-form');
    var signupForm = document.getElementById('signup-form');
    var showSignupLink = document.getElementById('show-signup');
    var showLoginLink = document.getElementById('show-login');

    createDemoUser();

    if (showSignupLink) {
      showSignupLink.addEventListener('click', function(e) {
        e.preventDefault();
        loginForm.classList.remove('active');
        setTimeout(function() {
          loginForm.style.display = 'none';
          signupForm.style.display = 'block';
          signupForm.classList.add('active');
        }, 100);
      });
    }

    if (showLoginLink) {
      showLoginLink.addEventListener('click', function(e) {
        e.preventDefault();
        signupForm.classList.remove('active');
        setTimeout(function() {
          signupForm.style.display = 'none';
          loginForm.style.display = 'block';
          loginForm.classList.add('active');
        }, 100);
      });
    }

    if (loginForm) {
      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        var usernameInput = document.getElementById('login-username');
        var passwordInput = document.getElementById('login-password');
        var username = usernameInput.value.trim();
        var password = passwordInput.value;
        var loginBtn = document.getElementById('login-btn');

        showInlineMessage('login-message', '', '');

        if (!username) {
          showInlineMessage('login-message', 'warning', 'Please enter your username');
          usernameInput.focus();
          return;
        }

        if (!password) {
          showInlineMessage('login-message', 'warning', 'Please enter your password');
          passwordInput.focus();
          return;
        }

        if (!window.db) {
          showInlineMessage('login-message', 'error', 'Firebase not initialized. Please refresh.');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<ion-icon name="sync" class="spinning"></ion-icon><span>Logging in...</span>';

        try {
          var usersRef = window.db.collection("users");
          var snapshot = await usersRef.where("username", "==", username).get();
          
          if (snapshot.empty) {
            showInlineMessage('login-message', 'error', 'Invalid username or password');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<span>Login</span><ion-icon name="arrow-forward-outline"></ion-icon>';
            return;
          }

          var userFound = false;
          var userData = null;
          
          snapshot.forEach(function(doc) {
            var data = doc.data();
            if (data.password === password) {
              userFound = true;
              userData = data;
              userData.id = doc.id;
            }
          });

          if (userFound) {
            localStorage.setItem('currentUser', JSON.stringify(userData));
            showInlineMessage('login-message', 'success', 'Login successful! Redirecting...');
            setTimeout(function() {
              window.location.href = 'home.html';
            }, 1000);
          } else {
            showInlineMessage('login-message', 'error', 'Invalid username or password');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<span>Login</span><ion-icon name="arrow-forward-outline"></ion-icon>';
          }
        } catch (error) {
          console.error("Error logging in: ", error);
          showInlineMessage('login-message', 'error', 'Login failed. Please try again!');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span>Login</span><ion-icon name="arrow-forward-outline"></ion-icon>';
        }
      });
    }

    if (signupForm) {
      signupForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        var usernameInput = document.getElementById('signup-username');
        var emailInput = document.getElementById('signup-email');
        var passwordInput = document.getElementById('signup-password');
        var confirmPasswordInput = document.getElementById('signup-confirm-password');
        var signupBtn = document.getElementById('signup-btn');
        
        var username = usernameInput.value.trim();
        var email = emailInput.value.trim();
        var password = passwordInput.value;
        var confirmPassword = confirmPasswordInput.value;

        showInlineMessage('signup-message', '', '');

        if (!username) {
          showInlineMessage('signup-message', 'warning', 'Please enter a username');
          usernameInput.focus();
          return;
        }

        if (!email) {
          showInlineMessage('signup-message', 'warning', 'Please enter your email');
          emailInput.focus();
          return;
        }

        var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showInlineMessage('signup-message', 'warning', 'Please enter a valid email address');
          emailInput.focus();
          return;
        }

        if (!password) {
          showInlineMessage('signup-message', 'warning', 'Please enter a password');
          passwordInput.focus();
          return;
        }

        if (!confirmPassword) {
          showInlineMessage('signup-message', 'warning', 'Please confirm your password');
          confirmPasswordInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showInlineMessage('signup-message', 'warning', 'Passwords do not match');
          confirmPasswordInput.value = '';
          confirmPasswordInput.focus();
          return;
        }

        if (password.length < 6) {
          showInlineMessage('signup-message', 'warning', 'Password must be at least 6 characters');
          passwordInput.value = '';
          confirmPasswordInput.value = '';
          passwordInput.focus();
          return;
        }

        if (!window.db) {
          showInlineMessage('signup-message', 'error', 'Firebase not initialized. Please refresh.');
          return;
        }

        signupBtn.disabled = true;
        signupBtn.innerHTML = '<ion-icon name="sync" class="spinning"></ion-icon><span>Creating...</span>';

        try {
          var usersRef = window.db.collection("users");
          var snapshot = await usersRef.where("username", "==", username).get();
          
          if (!snapshot.empty) {
            showInlineMessage('signup-message', 'error', 'Username already exists');
            signupBtn.disabled = false;
            signupBtn.innerHTML = '<span>Sign Up</span><ion-icon name="arrow-forward-outline"></ion-icon>';
            return;
          }

          var emailSnapshot = await usersRef.where("email", "==", email).get();
          if (!emailSnapshot.empty) {
            showInlineMessage('signup-message', 'error', 'Email already registered');
            signupBtn.disabled = false;
            signupBtn.innerHTML = '<span>Sign Up</span><ion-icon name="arrow-forward-outline"></ion-icon>';
            return;
          }

          var docRef = await window.db.collection("users").add({
            username: username,
            email: email,
            password: password,
            createdAt: new Date().toISOString()
          });

          console.log("User registered with ID: ", docRef.id);
          
          showInlineMessage('signup-message', 'success', 'Account created! Redirecting to login...');
          
          setTimeout(function() {
            signupForm.reset();
            signupForm.classList.remove('active');
            setTimeout(function() {
              signupForm.style.display = 'none';
              loginForm.style.display = 'block';
              loginForm.classList.add('active');
            }, 100);
          }, 1500);
          
        } catch (error) {
          console.error("Error registering user: ", error);
          showInlineMessage('signup-message', 'error', 'Error creating account. Please try again.');
          signupBtn.disabled = false;
          signupBtn.innerHTML = '<span>Sign Up</span><ion-icon name="arrow-forward-outline"></ion-icon>';
        }
      });
    }
  });
</script>

</body>
</html>
